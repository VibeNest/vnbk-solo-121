services:
  app:
    build: .
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: test
      PG_PASSWORD: test
      PG_DB: test
    ports:
      - "8080:8080"
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
